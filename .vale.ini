# Vale configuration for the embedded guide text (`gddy guide <name>`).
# Local rules live in .vale/styles/GddyCli. The only package rule that runs is
# Microsoft.Contractions: the package is downloaded by `vale sync`, and each
# package rule has to be switched on by name below.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft

[rust/src/*/guides/*.md]
BasedOnStyles = GddyCli
Microsoft.Contractions = YES
