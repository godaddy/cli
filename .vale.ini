# Vale configuration for the embedded guide text (`gddy guide <name>`).
# Local rules live in .vale/styles/GddyCli. The whole Microsoft package runs, and each
# package rule that doesn't fit terminal text is switched off below with a reason. The
# package is downloaded by `vale sync`. A rule added by a package update runs by default,
# so a new finding after an update means a new rule: review it, then fix the text or
# switch the rule off here with a reason.
# Run Vale 3.24.0 or later locally. The CI job pins the same version.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft

[rust/src/*/guides/*.md]
BasedOnStyles = GddyCli, Microsoft

# Package rules that are off. Each has one reason.
# Acronyms: readers are developers, so DNS, REST, CNAME and similar need no definition.
Microsoft.Acronyms = NO
# Auto: "auto-renew" is the product term and the `--auto-renew` flag name.
Microsoft.Auto = NO
# Dashes: GddyCli.NoEmDash already bans the em dash, so this would report the same text twice.
Microsoft.Dashes = NO
# Foreign: its fix drops the space after "e.g." ("for examplethe"). GddyCli.LatinAbbreviations replaces it.
Microsoft.Foreign = NO
# GeneralURL: the readers are developers, and "URL" is the right word for them.
Microsoft.GeneralURL = NO
# HeadingAcronyms: it flags "CLI", "DNS" and "PAT" in headings, which are the terms readers search for.
Microsoft.HeadingAcronyms = NO
# HeadingColons: it flags the title "`gddy <product>`: <summary>", where the command name comes first.
Microsoft.HeadingColons = NO
# Headings: it flags product names and acronyms in headings ("GoDaddy", "DNS"). Heading case stays a manual check.
Microsoft.Headings = NO
# Passive: GddyCli.NoPassiveVoice covers the phrases that matter. This rule flags every "is" plus a participle.
Microsoft.Passive = NO
# Quotes: it wants punctuation inside quotes, which would put a period inside a quoted command or value.
Microsoft.Quotes = NO
# SentenceLength: GddyCli.MaxSentenceLength sets the limit instead.
Microsoft.SentenceLength = NO
# Terms: it swaps "agent" for "personal digital assistant" and other Windows-era product terms.
Microsoft.Terms = NO
# Vocab: it only asks the writer to check a word against a Microsoft word list ("against", "allow", "set the").
Microsoft.Vocab = NO

# Paragraphs that start with "AI assistants:" speak to an AI assistant, not to the
# reader of the guide. Tests pin their exact wording, so the prose rules skip them.
BlockIgnores = (?m)^AI assistants:[^\n]*
