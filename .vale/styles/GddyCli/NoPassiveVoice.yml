# Matches a short list of common passive phrases. A manual check finds the rest.
extends: existence
message: "Passive voice detected ('%s'). Prefer active voice."
level: warning
ignorecase: true
tokens:
  - 'is created'
  - 'is returned'
  - 'is sent'
  - 'is deleted'
  - 'is updated'
  - 'is used'
  - 'is required'
  - 'is needed'
  - 'is called'
  - 'is stored'
  - 'is generated'
  - 'is triggered'
  - 'is passed'
  - 'is included'
  - 'is provided'
  - 'are created'
  - 'are returned'
  - 'are sent'
  - 'are deleted'
  - 'are updated'
  - 'are used'
  - 'are required'
  - 'are stored'
  - 'are included'
  - 'are provided'
  - 'was created'
  - 'was returned'
  - 'was sent'
  - 'was deleted'
  - 'was updated'
  - 'were created'
  - 'were returned'
  - 'were sent'
  - 'been created'
  - 'been deleted'
  - 'been updated'
  - 'been sent'
