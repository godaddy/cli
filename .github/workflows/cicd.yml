name: CICD
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

jobs:
  cicd:
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-${{ github.ref }}
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Check API catalog for unresolved external $refs
        working-directory: .
        run: |
          count=$(grep -r '"[$]ref"' rust/schemas/api/*.json | grep -v '"#/' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: $count unresolved external \$ref(s) in committed API catalog schemas:"
            grep -r '"[$]ref"' rust/schemas/api/*.json | grep -v '"#/'
            exit 1
          fi
