name: CICD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cicd:
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-${{ github.ref }}
    permissions:
      contents: read
      checks: write
      issues: write
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --workspace

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Check module size limits
        working-directory: .
        run: ./rust/scripts/check-module-size.sh

      - name: Audit dependencies for known vulnerabilities
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          working-directory: rust
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check API catalog for unresolved external $refs
        working-directory: .
        run: |
          set -o pipefail
          if grep -r '"[$]ref"[[:space:]]*:[[:space:]]*"[^#]' rust/schemas/api/*.json; then
            echo "ERROR: unresolved external \$ref(s) in committed API catalog schemas (shown above)"
            exit 1
          fi

  guides-lint:
    # Lints the embedded guide text with Vale. Findings are reported but don't fail
    # the job yet (fail_on_error: false); a later change sets it to true. Don't make
    # this job a required check before then. The action reports through pull request
    # annotations, so it runs only on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint guide text
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.24.0
          reviewdog_version: 0.21.0
          fail_on_error: false
          sync: false
          files: rust/src
          glob: "**/guides/*.md"
