name: Guides lint
on:
  # Runs only on pull requests, and only when a guide, a Vale rule, or this workflow
  # changes. The action reports through pull request annotations, so there is no
  # push trigger. There is no branch filter, so stacked pull requests are linted too.
  pull_request:
    paths:
      - "rust/src/**/guides/*.md"
      - ".vale.ini"
      - ".vale/**"
      - ".github/workflows/guides-lint.yml"

jobs:
  guides-lint:
    # Lints the embedded guide text with Vale (the local rules plus one package rule, which
    # the action downloads with `vale sync`). Findings are reported but do not fail
    # the job yet (fail_on_error: false); a later change sets it to true.
    # Don't make this job a required check: a workflow filtered by `paths` never starts
    # on pull requests that skip it, so a required check would wait forever.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint guide text
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.24.0
          reviewdog_version: 0.21.0
          fail_on_error: false
          files: rust/src
          glob: "**/guides/*.md"
