# gddy environments — copy/paste template for internal developers.
#
# Copy this file to your gddy config dir (only the entries you need):
#   Linux/XDG : ~/.config/gddy/environments.toml   (or $XDG_CONFIG_HOME/gddy/…)
#   macOS     : ~/Library/Application Support/gddy/environments.toml
#   Windows   : %APPDATA%\gddy\environments.toml
#
# Built-in `ote` and `prod` resolve without this file; you only need entries for
# the internal `dev`/`test` environments. Anything here can be overridden at
# runtime by `<ENV>_API_URL`, `<ENV>_DOMAINS_API_URL`, `<ENV>_API_KEY`,
# `<ENV>_API_SECRET` env vars (e.g. DEV_API_KEY), or `--api-key/--api-secret`.
#
# ── Auth ───────────────────────────────────────────────────────────────────
# The `domain` commands hit the GoDaddy Domains API, which is OAuth-enabled on
# all environments (run `gddy auth login --env <env>` first), so no sso-key is
# needed. `api_key`/`api_secret` are optional and affect ONLY `domain:*`
# commands: when set (here, via `<ENV>_API_KEY`/`_API_SECRET`, or
# `--api-key`/`--api-secret`), those commands send `Authorization: sso-key …`
# instead of the OAuth bearer. They do not affect any non-domain command.
#
# `client_id`: a custom env needs one for PKCE login; the per-env public OAuth
# client ids are filled in below. Override via DEV_OAUTH_CLIENT_ID /
# TEST_OAUTH_CLIENT_ID if needed. auth/token URLs derive from api_url
# (…/v2/oauth2/authorize, …/v2/oauth2/token). `domains_api_url` defaults to
# `api_url`, so a single host per env is enough.

# Internal dev gateway.
[environments.dev]
api_url = "https://api.dev-godaddy.com"
client_id = "94488449-5769-4ecf-8bf4-9f8aa83859a3"

# Internal test gateway.
[environments.test]
api_url = "https://api.test-godaddy.com"
client_id = "e710d8b9-f4e5-4178-b1bf-98dfcd15d4ed"
