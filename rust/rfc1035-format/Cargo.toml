[package]
name = "rfc1035-format"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
description = "Parser and writer for the RFC 1035 master file (zone file) format, with support for registering non-standard record types."

[dependencies]

[lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "deny", priority = -1 }
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
non_ascii_idents = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused = { level = "warn", priority = -1 }
unused_import_braces = "warn"
unused_qualifications = "warn"
missing_docs = "warn"

[lints.clippy]
exit = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"
dbg_macro = "warn"
inefficient_to_string = "warn"
match_same_arms = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
