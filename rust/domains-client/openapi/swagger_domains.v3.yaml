  /zones/{zone}/dns-records/{recordId}:
    put:
      operationId: replaceDNSRecord
      tags:
      - Records
      summary: Replace a DNS record
      description: 'Fully replaces an existing DNS resource record identified by

        recordId within the zone. All writable fields (name, type, data,

        ttl) must be supplied; partial updates are not supported on this

        endpoint. Changes are applied synchronously.


        GoDaddy-managed system records (SOA and NS) are read-only. When

        recordId refers to such a record, the request fails with

        `409 Conflict` — the record exists but cannot be modified.

        '
      parameters:
      - $ref: '#/components/parameters/xRequestId'
      - $ref: '#/components/parameters/xShopperId'
      - $ref: '#/components/parameters/zonePath'
      - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DNSRecord'
            examples:
              apexARecord:
                summary: Replace apex A record
                value:
                  name: '@'
                  type: A
                  data: 192.0.2.1
                  ttl: 3600
      security:
      - oauth2:
        - domains.dns:update
      responses:
        '200':
          description: DNS record replaced.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/xRequestId'
          content:
            application/json:
