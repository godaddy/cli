[package]
name = "godaddy-cli"
version = "0.2.0"
edition = "2024"
description = "GoDaddy developer CLI"
license = "Proprietary"

[workspace]
members = [".", "tools/generate-api-catalog", "domains-client"]

[[bin]]
name = "gddy"
path = "src/main.rs"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["std", "string"] }
cli-engine = { features = ["pkce-auth"], version = "0.6" }
dirs = "6"
domains-client = { path = "domains-client" }
fancy-regex = "0.14"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
open = "5"
phonenumber = "0.3"
regex = { version = "1", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
self-replace = "1.5.0"
semver = { version = "1.0.28", default-features = false, features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
iso_currency = "0.5.3"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "deny", priority = -1 }
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
non_ascii_idents = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused = { level = "warn", priority = -1 }
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
exit = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
wildcard_dependencies = "deny"
dbg_macro = "warn"
inefficient_to_string = "warn"
match_same_arms = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
