[package]
name = "platform-app-client"
version = "0.2.20"
edition = "2024"
license = "Proprietary"
description = "Generated App Registry GraphQL client (application/release/enablement operations), produced from the vendored subgraph schema by graphql_client at build time."

[dependencies]
generated-client-support = { path = "../generated-client-support" }
graphql_client = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
graphql_client_codegen = "0.14"
prettyplease = "0.2"
proc-macro2 = "1"
syn = "2"
# graphql_client_codegen's `GraphQLClientCodegenOptions` setters take syn 1.x
# types (that's the syn major it depends on internally) — a second, renamed
# copy alongside the syn 2.x used for the final `syn::parse2` +
# `prettyplease::unparse` pretty-print step below.
syn1 = { package = "syn", version = "1" }

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
