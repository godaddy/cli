type Mutation {
  """
  Activate a release and, when permitted, promote its parent application to ACTIVE.
  """
  activateRelease(
    """The ID of the application."""
    applicationId: ID!

    """The ID of the release to activate."""
    releaseId: ID!
  ): ApplicationRelease

  """Archive an existing Application."""
  archiveApplication(
    """The ID of the application to archive."""
    id: String!
  ): Application

  """Confirm a listing media upload after the client PUTs the file to S3."""
  confirmMediaObject(
    """The application that owns the media object — used for authorization."""
    applicationId: ID!

    """The media object ID returned from createMediaUploadUrl."""
    mediaObjectId: ID!
  ): MediaObject

  """Create a new Application."""
  createApplication(input: MutationCreateApplicationInput!): Application

  """
  Create a pending listing media record and return a pre-signed S3 PUT URL.
  """
  createMediaUploadUrl(
    """The application that owns the listing (1:1)."""
    applicationId: ID!

    """MIME type of the file to upload."""
    contentType: ListingMediaContentType!

    """
    Declared file size in bytes. Rejected if it exceeds the role cap before issuing the presigned URL.
    """
    fileSizeBytes: Int!

    """Original filename from the client."""
    filename: String!

    """Merchandising role for this asset."""
    role: ListingMediaRole!

    """
    Optional ordering for screenshots/videos (0–7). Defaults to next slot. Ignored for other roles (defaults to 0).
    """
    sortOrder: Int
  ): CreateMediaUploadUrlResponse

  """Create a new release for an application."""
  createRelease(input: MutationCreateReleaseInput!): ApplicationRelease

  """
  Deactivate an application through its lifecycle operation. Activate it again by activating a release.
  """
  deactivateApplication(
    """The ID of the application to deactivate."""
    id: String!
  ): Application

  """
  Deactivate a release. When it is the last active release, its application listing is also deactivated.
  """
  deactivateRelease(
    """The ID of the application."""
    applicationId: ID!

