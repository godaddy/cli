  """The globally-unique ID of the action."""
  id: String!

  """A unique identifier for the action within the application."""
  name: String!

  """The timestamp of when the action was last updated."""
  updatedAt: DateTime!

  """The endpoint URL that will be called when this action is triggered."""
  url: String!
}

"""Input for creating a new application action."""
input ApplicationActionCreateInput {
  """A unique identifier for the action within the application."""
  name: String!

  """
  The path of the endpoint URL that will be called when this action is triggered.
  """
  url: String!
}

"""
A dependency an application release declares on another application (the application's id, the name it was declared under, and its required/excluded/enabled state).
"""
type ApplicationDependency {
  """
  The immutable id of the application depended upon. Unaffected by renames of that application.
  """
  applicationId: ID!

  """
  The application name this dependency was declared under. A record of what was declared, not a live reference — it is not rewritten when the depended-upon application is renamed, so it can differ from that application's current name. Use `applicationId` to identify the application.
  """
  name: String!

  """The declared state for this application dependency."""
  state: ApplicationDependencyState!
}

"""
Input for declaring a dependency on another application from a release.
"""
input ApplicationDependencyInput {
  """
  The name of the application depended upon. Must match a non-archived application.
  """
  name: String!

  """The declared state for this application dependency."""
  state: ApplicationDependencyState!
}

"""The state of an application dependency declaration."""
enum ApplicationDependencyState {
  """
  The dependency application is enabled by default but can be overridden.
  """
  ENABLED

  """
  The dependency application is excluded and must not be enabled alongside this release.
  """
  EXCLUDED

  """
  The dependency application is required and cannot be disabled while this release is live.
  """
  REQUIRED
}

