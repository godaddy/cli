  """When the application was enabled."""
  enabledAt: DateTime

  """The ID of the entity this application is enabled for."""
  entityId: String!

  """The type of entity (e.g. STORE)."""
  entityType: String!

  """The globally-unique ID of the enablement."""
  id: String!

  """When the enablement was last updated."""
  updatedAt: DateTime!
}

"""A listing for an application."""
type ApplicationListing {
  """The ID of the application this listing belongs to."""
  applicationId: ID!

  """The timestamp when the listing was created."""
  createdAt: DateTime!

  """
  Taxonomy facets for this listing (region, industry, category, tag, etc.).
  """
  facets: [ApplicationListingFacet!]!

  """CDN URL of the confirmed HIGHLIGHT asset, or null if not uploaded."""
  highlightImageUrl: String

  """CDN URL of the confirmed ICON asset, or null if not uploaded."""
  iconUrl: String

  """The globally-unique ID of the listing."""
  id: ID!

  """A description for the listing (plain text, max 4000 chars)."""
  listingDescription: String

  """HTTPS URL for the privacy policy. Null when not set."""
  privacyPolicyUrl: String

  """CDN URLs of confirmed SCREENSHOT assets, ordered by sort_order."""
  screenshotUrls: [String!]!

  """The lifecycle status of the listing."""
  status: ListingStatus!

  """A short marketing pitch for the listing (plain text, max 160 chars)."""
  tagline: String

  """HTTPS URL for the terms and conditions. Null when not set."""
  termsAndConditionsUrl: String

  """The timestamp when the listing was last updated."""
  updatedAt: DateTime!

  """CDN URLs of confirmed VIDEO assets, ordered by sort_order."""
  videoUrls: [String!]!

  """The visibility of the listing."""
