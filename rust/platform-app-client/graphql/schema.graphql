}

"""A taxonomy facet attached to a listing."""
type ApplicationListingFacet {
  """The facet namespace (e.g. 'region', 'industry', 'category', 'tag')."""
  namespace: String!

  """The facet value (e.g. 'US', 'retail', 'ecommerce')."""
  value: String!
}

"""
Filter listings by facet. Returns listings that either have no facets in the given namespace (unrestricted), or have at least one facet in that namespace matching any of the provided values.
"""
input ApplicationListingFacetFilterInput {
  """The facet namespace to filter on (e.g. 'region')."""
  namespace: String!

  """
  Accepted facet values (OR semantics within this filter). An empty array is treated as a no-op for this facet filter, not as a filter that matches nothing.
  """
  values: [String!]!
}

"""A namespace + value pair for a listing facet."""
input ApplicationListingFacetInput {
  """The facet namespace (e.g. 'region', 'industry', 'category', 'tag')."""
  namespace: String!

  """The facet value."""
  value: String!
}

"""Filter options for listing queries."""
input ApplicationListingFilterInput {
  """
  Restrict results to listings for these application IDs (max 50, duplicates ignored).
  """
  applicationIds: [ID!]

  """
  Filter by taxonomy facets. All provided filters must match (AND semantics across namespaces).
  """
  facets: [ApplicationListingFacetFilterInput!]

  """
  Filter by listing lifecycle status. Defaults to ACTIVE for public LISTED discovery. Pass [ACTIVE, INACTIVE] to include deactivated listings (e.g. My Apps by applicationIds).
  """
  status: [ListingStatus!]

  """
  Filter by visibility. Defaults to [LISTED] for public discovery. Pass [LISTED, UNLISTED, HIDDEN] to see all listings for an owner context.
  """
  visibility: [ListingVisibility!]
}

"""Fields to create or update a listing."""
input ApplicationListingInput {
  """
  Taxonomy facets for the listing. When provided, replaces all existing facets atomically.
  """
  facets: [ApplicationListingFacetInput!]

  """A description for the listing (plain text, max 4000 chars)."""
  listingDescription: String

  """
  HTTPS URL for the privacy policy (max 255 chars). Pass null or empty string to clear.
  """
  privacyPolicyUrl: String

  """
  The lifecycle status of the listing. Defaults to INACTIVE on create. ACTIVE requires listing description, privacy URL, terms URL, categories, industries, icon, and screenshots.
  """
  status: ListingStatus

  """A short marketing pitch (plain text, max 160 chars)."""
  tagline: String

  """
  HTTPS URL for the terms and conditions (max 255 chars). Pass null or empty string to clear.
  """
  termsAndConditionsUrl: String

  """The visibility of the listing. Defaults to LISTED."""
  visibility: ListingVisibility
}

