type Application {
  """The timestamp of when the Application was activated."""
  activatedAt: DateTime

  """The timestamp of when the Application was archived."""
  archivedAt: DateTime

  """
  The authorization scopes that the OAuth2 client has access to and will use to call API endpoints.
  """
  authorizationScopes: [String!]!

  """
  Earliest linked OAuth client ID for this application by createdAt then id (includes NULL-secret and ARCHIVED apps).
  """
  clientId: ID

  """
  The primary OAuth client secret for this application. Only returned on application creation.
  """
  clientSecret: String

  """The timestamp of when the Application was created."""
  createdAt: DateTime!

  """The timestamp of when the Application was deactivated."""
  deactivatedAt: DateTime

  """General information about your application."""
  description: String

  """The distribution type for this application."""
  distributionType: DistributionType!

  """The globally-unique ID of the Application."""
  id: ID!

  """A human-readable label of the Application for display purposes."""
  label: String!

  """
  Paginated listings for this application. Requires read scope. When using the filter, `applicationIds` is ignored — results are always scoped to this application.
  """
  listings(
    after: String
    before: String

    """Optional filter for the listings."""
    filter: ApplicationListingFilterInput
    first: Int
    last: Int
  ): ApplicationListingsConnection

  """A url-friendly name for the Application."""
  name: String!

  """The ID of the organization that owns this Application."""
  organizationId: ID!

  """
  The base URL of your application. This is the endpoint that the GoDaddy Commerce platform will call when integrated with actions.
  """
  proxyUrl: String

  """
  The public key (base64 encoded) for verifying action requests to your application.
  """
  publicKey: String

  """
  Additional OAuth redirect URIs on the application's OAuth client(s). URL-derived defaults (the application URL and {url}/api/godaddy/callback) are omitted so this list can be submitted unchanged on create or update.
  """
  redirectUris: [String!]!

  """The releases of the Application."""
  releases(
    after: String
    before: String
    first: Int
    last: Int

    """The order in which to sort the releases."""
    orderBy: ReleaseOrderBy

    """Filter by release status."""
    status: ReleaseStatusFilter
  ): ApplicationReleasesConnection

  """
  The secret for verifying webhook requests to your application. Copy and secure this secret. You will not see it again.
  """
  secret: String

  """The status of the application."""
  status: ApplicationStatus!

  """The timestamp of when the Application was updated."""
  updatedAt: DateTime!

  """The public website of the application."""
  url: String
}

"""An action that can be executed by an application within the platform."""
