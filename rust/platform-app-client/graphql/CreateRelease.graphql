mutation CreateRelease($input: MutationCreateReleaseInput!) {
  createRelease(input: $input) {
    id
    version
    description
    createdAt
    uiExtensions {
      id
      name
      handle
      type
      source
      target
    }
    settings {
      id
      groupSlug
      appSettingSlug
      entryPath
      capabilities
      order
      title
      titleKey
      description
      descriptionKey
      iconName
      iconLibrary
      metadata
      presentation
    }
  }
}
