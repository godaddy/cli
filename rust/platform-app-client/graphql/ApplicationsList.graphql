query ApplicationsList($status: ApplicationStatusFilter, $first: Int, $after: String) {
  applications(status: $status, first: $first, after: $after) {
    edges {
      node {
        id
        label
        name
        description
        status
        url
        proxyUrl
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
