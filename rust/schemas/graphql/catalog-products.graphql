  "Integer minor units as a JSON number with no fractional part (for example `1999` for $19.99 USD). Decimals such as `19.99` are rejected. Typed as Float so values can exceed GraphQL's 32-bit Integer. JPY uses the integral amount; USD is hundredths; TND is thousandths." value: Float!
}

type TextOption {
  "The timestamp of when the Option was created."
  createdAt: DateTime!
  "A description of the Option."
  description: String
  "HTML description for the Option. Will be used to display rich text content to customers."
  htmlDescription: String
  "The UUID of the Option"
  id: ID!
  "The display label of the Option"
  label: String!
  metafields(after: String, before: String, first: Int, "The key of the metafield. Requires namespace to be provided." key: String, last: Int, "The namespace of the metafield. Required when key is provided." namespace: String): OptionMetafieldsConnection
  "A unique name of the Option."
  name: String!
  "Represents the additional cost of a Text Option. When empty, it indicates this option allows for flexible pricing."
  prices(after: String, before: String, "Filter prices by currency code." currencyCode: CurrencyCodeFilter, first: Int, last: Int, paginationType: PaginationType = CURSOR): TextOptionPricesConnection
  "Whether the option is shareable across multiple SKU Groups (a global modifier)."
  shareable: Boolean!
  "The IDs of all SKU groups this option is associated with."
  skuGroupIds: [String!]!
  "The type of the option, one of `TEXT`, `NUMBER`, `LIST`, Option Values are available for the 'LIST' type."
  type: String
  "The timestamp of when the Option was updated."
  updatedAt: DateTime!
  "Provide validations on how the option can be applied to a SKU. If `TEXT` option then `min` and `max` apply to the number of characters. If `NUMBER` then `min` and `max` apply to the actual number value. If `LIST` then `min` and `max` apply to the number of values that can be selected."
  validation: OptionValidation
}

type TextOptionPricesConnection {
  edges: [TextOptionPricesConnectionEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type TextOptionPricesConnectionEdge {
  cursor: String!
  node: OptionPrice
}

