  addressDetails: AddressDetailsInput
  addressLine1: String
  addressLine2: String
  addressLine3: String
  adminArea1: String
  adminArea2: String
  adminArea3: String
  adminArea4: String
  countryCode: String
  postalCode: String
}

"Input for updating an existing file."
input UpdateFileInput {
  contentType: String
  description: String
  filename: String
}

input UpdateMediaObjectInput {
  id: String!
  label: String
  metafields: [UpsertMetafieldInput!]
  "Must be lowercase, alphanumeric, 1–255 characters, and may contain \"-\" or \"_\"." name: String
  position: Int
  "The type of the media. Currently accepted values on write: `VIDEO`, `IMAGE`, `AUDIO`. `PHOTO` is not accepted on create or update." type: String
  url: String
}

"A single option and its new position within a SKU group."
input UpdateSKUGroupOptionPositionInput {
  optionId: String!
  position: Int!
}

"Filters items based on the date they were last updated."
input UpdatedAtFilter {
  gt: String
  lt: String
}

input UpsertMetafieldInput {
  key: String!
  namespace: String!
  "Metafield type. Currently accepted values (lowercase): `boolean`, `string`, `stringMultiLine`, `number`, `numberDecimal`, `date`, `dateTime`, `json`, `measurement`, `url`, `reference`, `money`, `list.string`, `list.number`, `list.numberDecimal`, `list.measurement`, `list.date`, `list.url`." type: String!
  value: String!
}

type _Service {
  "The sdl representing the federated service capabilities. Includes federation directives, removes federation types, and includes rest of full schema after schema directives have been applied"
  sdl: String
}
