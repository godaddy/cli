openapi: 3.0.3
info:
  title: Node.js Hosting Public API
  version: 1.0.0
  description: "Gateway-integrated API for customer apps. Authenticate with a
    forwarded customer session (Gasket auth), a developer portal API key
    (`Authorization: sso-key` on the public gateway URL), or an OAuth Bearer
    access token. When using Bearer auth, each operation requires the OAuth
    scope listed on that operation. API keys do not use OAuth scopes. After
    publish or domain changes, poll GET …/deployments and GET …/status. After
    zip upload, poll GET …/source/status with the returned jobId."
servers:
  - url: https://api.godaddy.com/v1/hosting/nodejs
    description: Production
  - url: /v1/hosting/nodejs
    description: Relative to the gateway origin the spec is served from
tags:
  - name: Apps
    description: Create, read, update, and delete apps.
  - name: Deployments
    description: Publish the latest code, list past deployments, roll back to a
      previous one, and probe runtime status.
  - name: Source
    description: Set the app source from a zip upload or a GitHub repo/branch, and
      poll the import job.
  - name: GitHub
    description: Inspect the GitHub connection and list repos/branches the connected
      token can access.
  - name: Secrets
    description: Manage environment secrets per variant. Values are never returned.
  - name: Logs
    description: Read application and build logs.
paths:
  /apps:
    get:
      operationId: listApps
      summary: List apps
      tags:
        - Apps
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:read
      responses:
        "200":
          description: App list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppList"
        "401": &a1
          description: Unauthorized (missing session, invalid API key or Bearer token, or
            insufficient OAuth scope)
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: &a2
            Retry-After:
              description: Seconds until the client may retry.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: Max requests per window for this operation.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
    post:
      operationId: createApp
      summary: Create app
      tags:
        - Apps
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCreateAppBody"
      responses:
        "202":
          description: App creation accepted; poll the returned job for status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppCreationJob"
        "401": *a1
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/jobs/{jobId}:
    get:
      operationId: getAppCreationStatus
      summary: Get app creation status
      tags:
        - Apps
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:create
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: App creation status (app present once active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppCreationStatus"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 120 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}:
    get:
      operationId: getApp
      summary: Get app
      tags:
        - Apps
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:read
      parameters:
        - &a3
          name: appId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: App details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppResponse"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
    patch:
      operationId: patchApp
      summary: Update app metadata
      tags:
        - Apps
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:update
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPatchAppBody"
      responses:
        "200":
          description: App updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppResponse"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
    delete:
      operationId: deleteApp
      summary: Delete app
      tags:
        - Apps
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:delete
      parameters:
        - *a3
      responses:
        "204":
          description: App deleted
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/deployments:
    get:
      operationId: listDeployments
      summary: List deployments
      tags:
        - Deployments
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:read
      parameters:
        - *a3
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDeploymentsList"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
    post:
      operationId: publishApp
      summary: Publish app (deploy latest code)
      tags:
        - Deployments
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.deploy:execute
      parameters:
        - *a3
      responses:
        "200":
          description: Publish started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPublishResponse"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/status:
    get:
      operationId: getAppStatus
      summary: Get app status
      tags:
        - Deployments
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.apps:read
      parameters:
        - *a3
      responses:
        "200":
          description: App status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppStatus"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 120 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/source:
    post:
      operationId: uploadAppSource
      summary: Upload app source (zip)
      tags:
        - Source
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.code:write
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - zipFile
              properties:
                zipFile:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicZipUploadResponse"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/source/status:
    get:
      operationId: getAppSourceUploadStatus
      summary: Poll zip upload status
      tags:
        - Source
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.code:write
      parameters:
        - *a3
        - name: jobId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upload status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicZipUploadStatus"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 120 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/source/git:
    post:
      operationId: startGitImport
      summary: Import app source from a GitHub repo/branch
      tags:
        - Source
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.code:write
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicGitImportBody"
      responses:
        "202":
          description: Git import accepted; poll the returned jobId for status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGitImportResponse"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/source/git/status:
    get:
      operationId: getGitImportStatus
      summary: Poll git import status
      tags:
        - Source
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.code:read
      parameters:
        - *a3
        - name: jobId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Git import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGitImportStatus"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 120 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/github/status:
    get:
      operationId: getGitHubStatus
      summary: Get GitHub connection status
      tags:
        - GitHub
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.github:execute
      parameters:
        - *a3
      responses:
        "200":
          description: GitHub connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGitHubStatus"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/github/repos:
    get:
      operationId: listGitHubRepos
      summary: List accessible GitHub repositories
      tags:
        - GitHub
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.github:execute
      parameters:
        - *a3
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - created
              - updated
              - pushed
              - full_name
            default: updated
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGitHubRepos"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/github/branches:
    get:
      operationId: listGitHubBranches
      summary: List branches for a GitHub repository
      tags:
        - GitHub
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.github:execute
      parameters:
        - *a3
        - name: owner
          in: query
          required: true
          schema:
            type: string
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGitHubBranches"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/secrets:
    get:
      operationId: listAppSecrets
      summary: List app secrets (metadata only)
      tags:
        - Secrets
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.secrets:write
      parameters:
        - *a3
        - name: variant
          in: query
          required: false
          schema:
            type: string
            enum:
              - preview
              - publish
      responses:
        "200":
          description: Secret names and metadata (values never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSecretsList"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
    post:
      operationId: updateAppSecrets
      summary: Add, update, or delete app secrets
      tags:
        - Secrets
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.secrets:write
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSecretsUpdateBody"
      responses:
        "200":
          description: Updated secret metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSecretsList"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/logs:
    get:
      operationId: getAppLogs
      summary: Get application logs
      tags:
        - Logs
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.logs:read
      parameters:
        - *a3
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum:
              - preview
              - publish
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: true
          schema:
            type: string
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCustomerLogs"
        "401": *a1
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 60 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
  /apps/{appId}/rollback:
    post:
      operationId: rollbackApp
      summary: Rollback to a previous deployment
      tags:
        - Deployments
      security:
        - cookieAuth: []
        - apiKeyAuth: []
        - oauth2:
            - hosting.paas.deploy:execute
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRollbackBody"
      responses:
        "200":
          description: Rollback started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRollbackResponse"
        "401": *a1
        "403":
          description: Rollback not enabled
        "404":
          description: Not found
        "429":
          description: "Too many requests. Limit: 10 requests per minute per client IP.
            X-RateLimit-* headers are returned on successful responses as well."
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRateLimitError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_idp
      description: Customer session cookie forwarded by API Gateway
    apiKeyAuth:
      type: http
      scheme: sso-key
      description: "Developer portal API key on the public gateway URL:
        `Authorization: sso-key {key}:{secret}`"
    oauth2:
      type: oauth2
      description: GoDaddy OAuth access token (Bearer)
      flows:
        clientCredentials:
          tokenUrl: https://oauth.api.godaddy.com/v2/oauth2/token
          scopes:
            hosting.paas.analytics:read: Access application analytics.
            hosting.paas.apps:create: Create applications and poll creation job status.
            hosting.paas.apps:delete: Delete applications.
            hosting.paas.apps:read: Read application details, list apps, deployments, and status.
            hosting.paas.apps:update: Update application metadata and runtime configuration.
            hosting.paas.code:read: Read, list, and export files; read database schemas,
              tables, and data; read Git history.
            hosting.paas.code:write: Write files; run zip uploads; sync GitHub; run database imports.
            hosting.paas.deploy:execute: Publish, rollback, restart, and deploy applications.
            hosting.paas.github:execute: Configure GitHub connections (auth, disconnect,
              pull, repository access).
            hosting.paas.health:read: Access application health and diagnose functionality.
            hosting.paas.logs:read: Access application logs.
            hosting.paas.secrets:write: Manage application secrets.
  schemas:
    PublicAppList:
      type: object
      properties:
        apps:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
              createdAt:
                type: string
              updatedAt:
                type: string
              urls:
                type: object
                properties:
                  preview:
                    type: string
                  publish:
                    type: string
                additionalProperties: false
              variants:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    status:
                      type: string
                  required:
                    - name
                    - status
                  additionalProperties: false
            required:
              - id
              - name
              - status
              - createdAt
              - updatedAt
              - urls
            additionalProperties: false
      required:
        - apps
      additionalProperties: false
    PublicAppResponse:
      type: object
      properties:
        app:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            status:
              type: string
            createdAt:
              type: string
            updatedAt:
              type: string
            urls:
              type: object
              properties:
                preview:
                  type: string
                publish:
                  type: string
              additionalProperties: false
            variants:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                required:
                  - name
                  - status
                additionalProperties: false
            variantsWithLifecycle:
              type: array
              items:
                type: object
                properties:
                  variant:
                    type: string
                  status:
                    type: string
                  lifecycleState:
                    type: string
                required:
                  - variant
                  - status
                additionalProperties: false
          required:
            - id
            - name
            - status
            - createdAt
            - updatedAt
            - urls
          additionalProperties: false
      required:
        - app
      additionalProperties: false
    PublicDeploymentsList:
      type: object
      properties:
        deployments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - deploying
                  - deployed
                  - failed
              gitHash:
                type: string
              createdAt:
                type: string
              updatedAt:
                type: string
              errorMessage:
                type: string
            required:
              - id
              - status
              - gitHash
              - createdAt
              - updatedAt
            additionalProperties: false
        totalCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        hasMore:
          type: boolean
      required:
        - deployments
        - totalCount
        - hasMore
      additionalProperties: false
    PublicAppStatus:
      type: object
      properties:
        appStatus:
          type: string
        variants:
          type: array
          items:
            type: object
            properties:
              variant:
                type: string
              status:
                type: string
              lifecycleState:
                type: string
            required:
              - variant
              - status
            additionalProperties: false
      required:
        - appStatus
        - variants
      additionalProperties: false
    PublicCreateAppBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9 _.'&(),!#:+/-]*$
        datacenter:
          type: string
          enum:
            - p3
